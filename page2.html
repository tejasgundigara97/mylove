<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0c0709; --wine:#2a0a12; --deep:#5a0f1d; --crimson:#9b1226; --scarlet:#c8172f; --rose:#e8a5ae; --white:#fbf8f7;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;margin:0;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;overflow:hidden;
  background-image:radial-gradient(ellipse 80% 60% at 50% 42%,var(--wine) 0%,var(--black) 72%)}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:1rem}

.book{--w:min(86vw,calc((100vh - 15rem) * .75),460px);
  position:relative;width:var(--w);height:calc(var(--w) * 4 / 3);perspective:2200px;
  filter:drop-shadow(0 24px 40px rgba(0,0,0,.65))}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.55,.05,.25,1),visibility 0s 0s;border-radius:.3rem .7rem .7rem .3rem}
.leaf.flipped{transform:rotateY(-180deg);visibility:hidden;transition:transform 1.1s cubic-bezier(.55,.05,.25,1),visibility 0s 1.1s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:inherit;overflow:hidden}
.back{transform:rotateY(180deg);background:linear-gradient(90deg,#1c0910,#2a0a12);box-shadow:inset 8px 0 18px rgba(0,0,0,.5)}

/* cover */
.cover{background:linear-gradient(135deg,#b3162b 0%,#8a0f20 55%,#5a0f1d 100%);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 0 0 10px rgba(0,0,0,.12),inset 12px 0 20px rgba(0,0,0,.35)}
.cover::after{content:"";position:absolute;inset:1.1rem;border:1px solid rgba(251,248,247,.35);border-radius:.4rem}
.cover svg{width:34%;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.cover path{fill:rgba(251,248,247,.08);stroke:var(--white);stroke-width:1.4;stroke-linejoin:round}

/* photo page */
.page{background:linear-gradient(90deg,#1c0910 0%,#2a0a12 6%,#2a0a12 100%);padding:7% 7% 7% 9%;
  box-shadow:inset 10px 0 18px rgba(0,0,0,.45)}
.print{width:100%;height:100%;background:var(--white);padding:3.5% 3.5% 11%;border-radius:.2rem;
  box-shadow:0 4px 14px rgba(0,0,0,.55)}
.print .pic{width:100%;height:100%;background:#120609;display:grid;place-items:center;overflow:hidden}
.print img{width:100%;height:100%;object-fit:contain;display:block}
.print svg{width:28%;height:auto;opacity:.55}
.print svg path{fill:none;stroke:var(--scarlet);stroke-width:1.4;stroke-linejoin:round}

/* "Something special" button (appears on the last page) */
.special-wrap{min-height:3.4rem;display:flex;align-items:center;justify-content:center}
.special{font:400 1.05rem var(--sans);letter-spacing:.06em;color:var(--white);cursor:pointer;
  padding:.85rem 2.2rem;border-radius:2rem;
  background:linear-gradient(180deg,#dc2f45 0%,#b3162b 45%,#8a0f20 100%);
  border:1px solid #5a0f1d;border-top-color:#f08a97;text-shadow:0 -1px 0 rgba(0,0,0,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.28),0 4px 0 #4a0a16,0 9px 16px rgba(0,0,0,.55);
  opacity:0;visibility:hidden;transform:translateY(8px);
  transition:opacity .8s .9s,transform .8s .9s,visibility 0s .9s,filter .2s}
.special.show{opacity:1;visibility:visible;transform:none}
.special:hover{filter:brightness(1.1)}
.special:active{transform:translateY(4px);box-shadow:inset 0 2px 5px rgba(0,0,0,.45),0 0 0 #4a0a16,0 2px 6px rgba(0,0,0,.5)}
.special:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

/* tap to enlarge */
.print .pic{cursor:zoom-in}
#zoom{position:fixed;inset:0;z-index:50;background:rgba(8,3,5,.96);overflow:auto;display:none;
  padding:calc(env(safe-area-inset-top,0px) + 3.5rem) 1rem calc(env(safe-area-inset-bottom,0px) + 2rem);cursor:zoom-out}
#zoom.open{display:block}
#zoom img{display:block;width:min(100%,900px);height:auto;margin:0 auto;background:var(--white);border-radius:.2rem}
#zoomx{position:fixed;top:calc(env(safe-area-inset-top,0px) + .8rem);right:1rem;z-index:51;width:2.6rem;height:2.6rem;border-radius:50%;
  border:1px solid var(--scarlet);background:var(--crimson);color:var(--white);font:400 1.5rem/1 var(--sans);cursor:pointer;display:none}
#zoom.open + #zoomx{display:block}

/* controls */
.controls{display:flex;align-items:center;gap:1.4rem;min-height:3.2rem}
.count{min-width:4.5rem;text-align:center;font:500 1.2rem var(--serif);color:var(--rose);letter-spacing:.05em}
.arrow{width:3.1rem;height:3.1rem;border-radius:50%;cursor:pointer;color:var(--white);font:400 1.5rem/1 var(--sans);
  background:linear-gradient(180deg,#dc2f45 0%,#b3162b 45%,#8a0f20 100%);
  border:1px solid #5a0f1d;border-top-color:#f08a97;text-shadow:0 -1px 0 rgba(0,0,0,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.28),0 4px 0 #4a0a16,0 9px 16px rgba(0,0,0,.55);
  transition:transform .15s,box-shadow .15s,filter .2s,opacity .3s}
.arrow:hover{filter:brightness(1.1);transform:translateY(-1px)}
.arrow:active{transform:translateY(4px);box-shadow:inset 0 2px 5px rgba(0,0,0,.45),0 0 0 #4a0a16,0 2px 6px rgba(0,0,0,.5)}
.arrow:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.arrow[disabled]{opacity:.28;cursor:default;pointer-events:none}
@media (prefers-reduced-motion:reduce){.leaf,.leaf.flipped{transition:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="book" id="book" aria-live="polite"></div>
  <div class="controls">
    <button class="arrow" id="prev" aria-label="Previous page">&#8249;</button>
    <div class="count" id="count">&nbsp;</div>
    <button class="arrow" id="next" aria-label="Next page">&#8250;</button>
  </div>
  <div class="special-wrap"><button class="special" id="special">Something special</button></div>
</div>

<div id="zoom"><img id="zoomimg" alt=""></div>
<button id="zoomx" aria-label="Close">&times;</button>

<script>
/*
  PHOTOS - the pictures in the order they appear in the album.
  Keep these files in the same place as this page (same GitHub folder).
*/
var PHOTOS = ["photo 1.jpg", "photo 2.jpg", "photo 3.jpg", "photo 4.jpg", "photo 5.jpg", "photo 6.jpg", "photo 7.jpg", "photo 8.jpg", "photo 9.jpeg"];

var PAGE3_READY = true;   // switch to true once page3.html is uploaded

/* ---------- Phone notifications (ntfy) - same topic as page 1 ---------- */
var NOTIFY_ON = true;
var NOTIFY_TOPIC = "TEJAS-TEJAL";
function notify(text){
  if (!NOTIFY_ON) return;
  try {
    fetch("https://ntfy.sh/" + encodeURIComponent(NOTIFY_TOPIC), { method: "POST", body: text, keepalive: true }).catch(function(){});
  } catch (e) {}
}

var HEART = '<svg viewBox="0 0 100 90" aria-hidden="true"><path d="M50 84 C20 60 6 44 6 27 C6 14 16 6 28 6 C38 6 46 12 50 20 C54 12 62 6 72 6 C84 6 94 14 94 27 C94 44 80 60 50 84 Z"/></svg>';
var list = PHOTOS.length ? PHOTOS : [null, null, null, null, null, null];
var P = list.length;          // number of photos
var L = P + 1;                // leaves: cover + photos
var book = document.getElementById("book");
var prev = document.getElementById("prev");
var next = document.getElementById("next");
var count = document.getElementById("count");
var leaves = [];
var cur = 0;                  // index of the leaf you are looking at (0 = cover)

function leaf(i){
  var el = document.createElement("div");
  el.className = "leaf";
  el.style.zIndex = L - i;
  var front = document.createElement("div");
  front.className = "face " + (i === 0 ? "cover" : "page");
  if (i === 0){
    front.innerHTML = HEART;
    front.addEventListener("click", function(){ go(1); });
  } else {
    var src = list[i - 1];
    front.innerHTML = '<div class="print"><div class="pic">' + (src ? '<img alt="" src="' + src + '">' : HEART) + '</div></div>';
    if (src) front.querySelector(".pic").addEventListener("click", function(){ if (cur === i) openZoom(src); });
  }
  var back = document.createElement("div");
  back.className = "face back";
  el.appendChild(front); el.appendChild(back);
  return el;
}
for (var i = 0; i < L; i++){ var l = leaf(i); leaves.push(l); book.appendChild(l); }
PHOTOS.forEach(function(s){ var im = new Image(); im.src = s; });   // preload

function go(n){
  n = Math.max(0, Math.min(L - 1, n));
  if (n === cur) return;
  cur = n;
  leaves.forEach(function(el, i){ el.classList.toggle("flipped", i < cur); });
  update();
  if (cur >= 1) notify(cur === P ? "Tejal reached the last photo (" + cur + " of " + P + ")" : "Tejal is on photo " + cur + " of " + P);
}
function update(){
  prev.disabled = cur === 0;
  next.disabled = cur === L - 1;
  count.innerHTML = cur === 0 ? "&nbsp;" : cur + " / " + P;
  document.getElementById("special").classList.toggle("show", cur === L - 1);
}
prev.addEventListener("click", function(){ go(cur - 1); });
next.addEventListener("click", function(){ go(cur + 1); });
document.addEventListener("keydown", function(e){
  if (zoom.classList.contains("open")) return;
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
});
var x0 = null;
book.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, { passive: true });
book.addEventListener("touchend", function(e){
  if (x0 === null) return;
  var dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (dx < -40) go(cur + 1); else if (dx > 40) go(cur - 1);
});

document.getElementById("special").addEventListener("click", function(){
  notify("Tejal tapped Something special");

  setTimeout(function(){
    window.location.href = "./page3.html";
  }, 600);
});

var zoom = document.getElementById("zoom");
function openZoom(src){
  document.getElementById("zoomimg").src = src;
  zoom.classList.add("open");
  zoom.scrollTop = 0;
  notify("Tejal opened photo " + cur + " in full view");
}
function closeZoom(){ zoom.classList.remove("open"); }
zoom.addEventListener("click", closeZoom);
document.getElementById("zoomx").addEventListener("click", closeZoom);
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeZoom(); });

update();
notify("Tejal opened the photo album");
</script>
</body>
</html>
