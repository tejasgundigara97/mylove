<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    background: #ECE2D7 center / cover no-repeat fixed;
    transition: background-image 1s;
    display: flex; align-items: center; justify-content: center;
    font-family: cursive;
  }
  #stage { position: relative; touch-action: none; transition: opacity 1s; }
  #board { position: absolute; left: 0; top: 0; border: 2px dashed #b9a999; }
  .piece {
    position: absolute; background-image: url("Heart_1.png");
    cursor: grab; touch-action: none; border-radius: 3px;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .piece.done { cursor: default; box-shadow: none; border-radius: 0; transition: left .15s, top .15s; }

  #final { display: none; flex-direction: column; align-items: center; gap: 32px; text-align: center; max-width: 700px; }
  #msg {
    margin: 0; font-size: 50px; color: black; -webkit-text-stroke: 1px black;
    opacity: 0; transition: opacity 1.5s;
  }
  #buttons { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; opacity: 0; transition: opacity 1.5s; }
  button {
    font-family: inherit; font-size: 30px; color: black; -webkit-text-stroke: 1px black;
    background: #ECE2D7; border: 2px solid black; padding: 10px 28px; cursor: pointer;
  }
  .show { opacity: 1 !important; }
</style>
</head>
<body>

<div id="stage"><div id="board"></div></div>

<div id="final">
  <p id="msg">Text 1Text 1Text 1Text 1Text 1Text 1Text 1Text 1Text 1Text 1</p>
  <div id="buttons">
    <button id="b1">Option 1</button>
    <button id="b2">Option 2</button>
  </div>
</div>

<script>
const COLS = 4, ROWS = 3;            // 12 pieces. Change for easier/harder.
const stage = document.getElementById("stage");
const board = document.getElementById("board");
let z = 1, solved = 0;

const W = Math.min(innerWidth - 32, 900), H = W * 941 / 1672;
const pw = W / COLS, ph = H / ROWS, TRAY = H + 24;
stage.style.width = W + "px";
stage.style.height = (TRAY + H) + "px";
board.style.width = W + "px"; board.style.height = H + "px";

const order = [...Array(COLS * ROWS).keys()].sort(() => Math.random() - 0.5);
for (let i = 0; i < COLS * ROWS; i++) {
  const c = i % COLS, r = Math.floor(i / COLS);
  const slot = order.indexOf(i);   // where this piece sits in the bottom grid
  const p = document.createElement("div");
  p.className = "piece";
  Object.assign(p.style, {
    width: pw + "px", height: ph + "px",
    backgroundSize: W + "px " + H + "px",
    backgroundPosition: (-c * pw) + "px " + (-r * ph) + "px",
    left: (slot % COLS) * pw + "px",
    top: TRAY + Math.floor(slot / COLS) * ph + "px"
  });
  let dx = 0, dy = 0, drag = false;
  p.addEventListener("pointerdown", e => {
    if (p.classList.contains("done")) return;
    drag = true; p.setPointerCapture(e.pointerId);
    dx = e.clientX - p.offsetLeft; dy = e.clientY - p.offsetTop;
    p.style.zIndex = ++z; p.style.cursor = "grabbing";
  });
  p.addEventListener("pointermove", e => {
    if (!drag) return;
    p.style.left = e.clientX - dx + "px"; p.style.top = e.clientY - dy + "px";
  });
  p.addEventListener("pointerup", () => {
    if (!drag) return;
    drag = false; p.style.cursor = "grab";
    const tx = c * pw, ty = r * ph;
    if (Math.abs(p.offsetLeft - tx) < pw * 0.25 && Math.abs(p.offsetTop - ty) < ph * 0.25) {
      p.style.left = tx + "px"; p.style.top = ty + "px";
      p.classList.add("done"); p.style.zIndex = 0;
      if (++solved === COLS * ROWS) win();
    }
  });
  stage.appendChild(p);
}

function win() {
  setTimeout(() => {
    stage.style.opacity = 0;
    setTimeout(() => {
      stage.style.display = "none";
      document.body.style.backgroundImage = 'url("Background_1920x1080.png")';
      document.getElementById("final").style.display = "flex";
      setTimeout(() => document.getElementById("msg").classList.add("show"), 50);
      setTimeout(() => document.getElementById("buttons").classList.add("show"), 2500);
    }, 1000);
  }, 800);
}

// What the buttons do (replace later with links to your next pages):
document.getElementById("b1").onclick = () => alert("Option 1 clicked");
document.getElementById("b2").onclick = () => alert("Option 2 clicked");
</script>
</body>
</html>
