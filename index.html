/* ---------- Phone notifications (ntfy) ---------- */
var NOTIFY_ON = true;               // set to false to turn notifications off
var NOTIFY_TOPIC = "TEJAS-TEJAL";   // must match the topic you subscribed to in the ntfy app
function plain(h){ return String(h).replace(/<br>/g, " "); }
function notify(text){
  if (!NOTIFY_ON) return;
  try {
    fetch("https://ntfy.sh/" + encodeURIComponent(NOTIFY_TOPIC), { method: "POST", body: text, keepalive: true }).catch(function(){});
  } catch (e) {}
}

var chat = document.getElementById("chat");
var status = document.getElementById("status");

function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function addRow(side, html){
  var row = document.createElement("div");
  row.className = "row " + side;
  var b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = html;
  row.appendChild(b);
  chat.appendChild(row);
  scrollDown();
  return row;
}

async function himSays(list){
  for (var i = 0; i < list.length; i++){
    status.textContent = "typing…";
    var t = document.createElement("div");
    t.className = "row him typing";
    t.innerHTML = '<div class="bubble"><i></i><i></i><i></i></div>';
    chat.appendChild(t); scrollDown();
    await wait(Math.min(3200, 900 + list[i].length * 16));
    t.remove();
    status.textContent = "online";
    addRow("him", list[i]);
    await wait(700);
  }
}

function showOptions(options){
  var box = document.createElement("div");
  box.className = "options";
  var label = document.createElement("div");
  label.className = "pick";
  label.textContent = "Choose one";
  box.appendChild(label);
  options.forEach(function(o){
    var btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = o.label;
    btn.addEventListener("click", function(){
      box.remove();
      addRow("her", o.label);
      notify("Tejal chose: " + plain(o.label));
      play(o.next);
    });
    box.appendChild(btn);
  });
  chat.appendChild(box);
  scrollDown();
}

async function play(id){
  var step = STORY[id];
  if (!step) return;
  await wait(700);
  await himSays(step.him || []);
  if (step.her){
    for (var i = 0; i < step.her.length; i++){
      await wait(900);
      addRow("her", step.her[i]);
    }
    await wait(500);
  }
  if (step.options && step.options.length) showOptions(step.options);
  else if (step.next) play(step.next);
  else {
    notify("Tejal reached the end of the chat");
    if (step.go && PAGE2_READY) setTimeout(function(){ location.href = step.go; }, 600);
  }
}

notify("Tejal opened the chat");
play("start");
