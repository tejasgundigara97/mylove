<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0c0709; --wine:#2a0a12; --crimson:#9b1226; --scarlet:#c8172f; --rose:#e8a5ae; --white:#fbf8f7;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{min-height:100%;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;
  background-image:radial-gradient(ellipse 80% 55% at 50% 35%,var(--wine) 0%,var(--black) 72%);background-attachment:fixed}
main{max-width:40rem;margin:0 auto;padding:2.2rem 1.4rem 5rem;display:flex;flex-direction:column;align-items:center;text-align:center}

.frame{--w:min(84vw,calc(58vh * 1108 / 1808),400px);
  width:calc(var(--w) + 20px);padding:10px;background:#14080b;border:1px solid rgba(232,165,174,.35);border-radius:.25rem;
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 26px 60px rgba(0,0,0,.7),0 0 60px rgba(155,18,38,.25);
  opacity:0;transition:opacity 1.6s ease}
.frame.in{opacity:1}
canvas{display:block;width:100%;height:auto;aspect-ratio:1108 / 1808;background:#14080b}

.words{font-family:var(--serif);font-weight:300;font-size:clamp(1.25rem,3.5vw,1.65rem);line-height:1.6;
  max-width:32rem;margin:2.2rem 0 0;color:#f6ebec;min-height:7rem}
.words span{opacity:0;transition:opacity .9s ease}
.words span.on{opacity:1}

.go-wrap{margin-top:1.8rem;min-height:3.4rem}
.go{padding:.95rem 2.6rem;border-radius:2rem;cursor:pointer;color:var(--white);font:400 1.1rem/1.2 var(--sans);letter-spacing:.06em;
  background:linear-gradient(180deg,#dc2f45 0%,#b3162b 45%,#8a0f20 100%);
  border:1px solid #5a0f1d;border-top-color:#f08a97;text-shadow:0 -1px 0 rgba(0,0,0,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.28),0 4px 0 #4a0a16,0 9px 16px rgba(0,0,0,.55);
  opacity:0;visibility:hidden;transform:translateY(8px);
  transition:opacity 2s,transform 2s,visibility 0s,filter .2s}
.go.show{opacity:1;visibility:visible;transform:none}
.go:hover{filter:brightness(1.1)}
.go:active{transform:translateY(4px);box-shadow:inset 0 2px 5px rgba(0,0,0,.45),0 0 0 #4a0a16,0 2px 6px rgba(0,0,0,.5)}
.go:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.frame,.words span,.go{transition:opacity .4s}}
</style>
</head>
<body>
<main>
  <div class="frame" id="frame"><canvas id="art" aria-label="Painting"></canvas></div>
  <p class="words" id="words"></p>
  <div class="go-wrap"><button class="go" id="go">Show me</button></div>
</main>

<script>
/*
  TIMELINE (whole page finishes in about 30 seconds)
   0s  - 14s : the painting appears as a blurred mosaic and slowly sharpens
   15s - 25s : the text appears word by word
   27s - 29s : the "Show me" button fades in
*/
var IMAGE = "painting.jpg";
var TEXT = "I wanna give you some proves, just have a look, I did not start this painting after breakup, it was something I wanted to do";
var REVEAL_MS = 14000, TEXT_AT = 15000, TEXT_MS = 10000, BUTTON_AT = 27000;
var PAGE5_READY = false;   // switch to true once page5.html is uploaded

/* ---------- Phone notifications (ntfy) - same topic as the other pages ---------- */
var NOTIFY_ON = true;
var NOTIFY_TOPIC = "TEJAS-TEJAL";
function notify(text){
  if (!NOTIFY_ON) return;
  try {
    fetch("https://ntfy.sh/" + encodeURIComponent(NOTIFY_TOPIC), { method: "POST", body: text, keepalive: true }).catch(function(){});
  } catch (e) {}
}

var calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
if (calm){ REVEAL_MS = 2000; TEXT_AT = 3000; TEXT_MS = 4000; BUTTON_AT = 8000; }

var canvas = document.getElementById("art");
var ctx = canvas.getContext("2d");
var frame = document.getElementById("frame");
var words = document.getElementById("words");
var go = document.getElementById("go");

/* build the text as separate words so they can fade in one by one */
var spans = TEXT.split(" ").map(function(w){
  var s = document.createElement("span");
  s.textContent = w;
  words.appendChild(s);
  words.appendChild(document.createTextNode(" "));
  return s;
});

function showText(){
  var step = TEXT_MS / spans.length;
  spans.forEach(function(s, i){ setTimeout(function(){ s.classList.add("on"); }, i * step); });
  setTimeout(function(){ words.scrollIntoView({ behavior: "smooth", block: "center" }); }, 600);
}
function showButton(){
  go.classList.add("show");
  go.scrollIntoView({ behavior: "smooth", block: "center" });
}

var img = new Image();
img.onload = function(){
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  var W = canvas.width, H = canvas.height;
  var tiny = document.createElement("canvas");
  var tctx = tiny.getContext("2d");
  var lastB = -1;
  var start = performance.now();
  frame.classList.add("in");

  function draw(b){
    if (b <= 1){
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, 0, 0, W, H);
      return;
    }
    var tw = Math.ceil(W / b), th = Math.ceil(H / b);
    tiny.width = tw; tiny.height = th;
    tctx.drawImage(img, 0, 0, tw, th);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tiny, 0, 0, tw, th, 0, 0, tw * b, th * b);
  }

  function frameStep(now){
    var t = Math.min(1, (now - start) / REVEAL_MS);
    var b = Math.max(1, Math.round(Math.pow(150, 1 - t)));   // big blocks -> single pixels
    if (b !== lastB){ draw(b); lastB = b; }
    canvas.style.filter = t < 1 ? "blur(" + ((1 - t) * 10).toFixed(1) + "px)" : "none";
    if (t < 1) requestAnimationFrame(frameStep);
  }
  requestAnimationFrame(frameStep);
};
img.onerror = function(){ frame.classList.add("in"); };
img.src = IMAGE;

setTimeout(showText, TEXT_AT);
setTimeout(showButton, BUTTON_AT);

go.addEventListener("click", function(){
  notify("Tejal tapped Show me");
  if (PAGE5_READY) setTimeout(function(){ location.href = "page5.html"; }, 600);
});
notify("Tejal opened page 4");
</script>
</body>
</html>
